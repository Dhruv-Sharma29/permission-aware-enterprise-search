[project]
name = "permission-aware-search"
version = "0.1.0"
description = "Permission-aware enterprise search: authorized hybrid retrieval, citations, revocation (portfolio project 03)"
requires-python = ">=3.12,<3.13"
# torch, transformers, numpy, PIL come from the host's system site-packages (see env/ENVIRONMENT.md).
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "rapidocr-onnxruntime>=1.4",
    # Must match the host numpy that system torch/scipy were built against (numpy 2 breaks their ABI).
    "numpy==1.26.4",
]

[project.optional-dependencies]
# macOS / any machine without the GX10's system torch: `uv sync --extra standalone`
standalone = ["torch>=2.4", "transformers>=4.44", "pillow>=10.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
